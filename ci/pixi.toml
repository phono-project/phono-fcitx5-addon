[workspace]
name = "phono-core-linux-ci"
version = "0.1.0"
description = "Pinned CPU code generation and Linux glibc 2.28 core toolchain"
channels = ["conda-forge"]
platforms = [{ name = "linux-glibc228", platform = "linux-64", glibc = "2.28" }]
requires-pixi = ">=0.81.0"

[dependencies]
python = "=3.12.7"
cmake = "=3.31.6"
ninja = "=1.12.1"
gcc_linux-64 = "=13.3.0"
gxx_linux-64 = "=13.3.0"
sysroot_linux-64 = "2.28.*"
libgcc = "13.*"
libstdcxx = "13.*"
pkg-config = ">=0.29,<1"
nlohmann_json = "=3.12.0"
pyyaml = ">=6.0,<7"
pip = ">=25,<27"

[pypi-dependencies]
# A direct CPU-wheel URL prevents the default PyPI CUDA dependencies from
# entering this build-only environment. Native phono-core never links libtorch.
torch = { url = "https://download.pytorch.org/whl/cpu/torch-2.13.0%2Bcpu-cp312-cp312-manylinux_2_28_x86_64.whl" }

[tasks]
build-core = "python ../tools/ci_build_core.py"
