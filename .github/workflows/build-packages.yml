name: Build downloadable Linux packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Record source time and validate release version
        id: metadata
        shell: bash
        run: |
          printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"
          version=$(sed -n 's/.*project(.*VERSION \([0-9.]*\).*/\1/p' CMakeLists.txt)
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"
          if test "$GITHUB_REF_TYPE" = tag; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
      - uses: prefix-dev/setup-pixi@a09b6247153796b190642a2b53fac4241043cf6f # v0.10.0
        with:
          pixi-version: v0.81.0
          manifest-path: ci/pixi.toml
          locked: true
          cache: true
      - name: Prepare the reviewed pinned core source
        run: python3 tools/ci_prepare_core.py --output "$GITHUB_WORKSPACE/build/ci/core-source"
      - name: Build shared core with the locked Pixi glibc 2.28 sysroot
        run: |
          pixi run --locked --manifest-path ci/pixi.toml \
            python tools/ci_build_core.py \
            --source "$GITHUB_WORKSPACE/build/ci/core-source" \
            --prefix "$GITHUB_WORKSPACE/build/ci/core-prefix" --jobs 4
          python3 tools/check_elf.py \
            "$GITHUB_WORKSPACE/build/ci/core-prefix/lib/libphono_core.so" \
            --max-glibc 2.28 --max-glibcxx 3.4.31 --max-cxxabi 1.3.14 \
            --no-rpath --c-api-only
      - name: Preserve core ABI, licenses and provenance as one artifact
        run: |
          tar -C "$GITHUB_WORKSPACE/build/ci/core-prefix" -czf "${GITHUB_WORKSPACE}/build/ci/core-prefix.tar.gz" .
          sha256sum "${GITHUB_WORKSPACE}/build/ci/core-prefix.tar.gz" > "${GITHUB_WORKSPACE}/build/ci/core-prefix.tar.gz.sha256"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phono-core-prefix
          path: |
            build/ci/core-prefix.tar.gz
            build/ci/core-prefix.tar.gz.sha256
          if-no-files-found: error

  packages:
    needs: core
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: debian13
            image: debian:13
            max_glibc: '2.41'
          - target: ubuntu2404
            image: ubuntu:24.04
            max_glibc: '2.39'
          - target: fedora43
            image: fedora:43
            max_glibc: '2.42'
          - target: opensuse-tumbleweed
            image: registry.opensuse.org/opensuse/tumbleweed:latest
            max_glibc: native
          - target: arch
            image: archlinux:base
            max_glibc: native
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: phono-core-prefix
          path: build/ci/downloads
      - name: Check and unpack the core artifact
        shell: bash
        run: |
          cd build/ci/downloads
          # Normalize the checksum filename created in the upstream job.
          checksum=$(cut -d ' ' -f1 core-prefix.tar.gz.sha256)
          printf '%s  core-prefix.tar.gz\n' "$checksum" | sha256sum --check
          mkdir -p ../core-prefix
          tar -xf core-prefix.tar.gz -C ../core-prefix
      - name: Build and test in the target distribution
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          IMAGE: ${{ matrix.image }}
          MAX_GLIBC: ${{ matrix.max_glibc }}
        run: |
          # Versioned stable tags and rolling distribution tags are resolved to
          # immutable digests here and recorded with the downloadable artifacts.
          docker pull "$IMAGE"
          digest=$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')
          docker run --rm --platform linux/amd64 \
            -v "$GITHUB_WORKSPACE:/workspace" -w /workspace \
            -e TARGET -e MAX_GLIBC -e "CONTAINER_DIGEST=$digest" \
            -e "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" \
            "$digest" bash -euc '
              bash ci/install-native-deps.sh "$TARGET"
              python3 tools/ci_build_packages.py --target "$TARGET" \
                --core-prefix /workspace/build/ci/core-prefix --max-glibc "$MAX_GLIBC" \
                --output "/workspace/dist/$TARGET"
            '
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: phono-fcitx5-addon-x86_64-${{ needs.core.outputs.version }}-${{ matrix.target }}
          path: dist/${{ matrix.target }}/*
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: packages
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: phono-fcitx5-addon-x86_64-*
          merge-multiple: true
          path: dist
      - name: Publish tested binary downloads for the pushed release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag --generate-notes
          fi
